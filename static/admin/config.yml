# Sveltia CMS - Desire Lines Editions. Open https://desirelineseditions.co.uk/admin/
# Sign-in goes through the same Cloudflare worker as This Was Tomorrow:
# desirelineseditions.co.uk must be in the worker's ALLOWED_DOMAINS (if that variable is set).
backend:
  name: github
  repo: cardopoli/desire-lines-editions
  branch: main
  base_url: https://sveltia-cms-auth.cardopoli.workers.dev

site_url: https://desirelineseditions.co.uk
display_url: https://desirelineseditions.co.uk
logo:
  src: https://desirelineseditions.co.uk/favicon.svg

media_folder: static/images
public_folder: /images

media_libraries:
  default:
    config:
      slugify_filename: true
      # no automatic WebP conversion: Safari can't make WebP, so uploads from Safari were lost

collections:

  - name: catalogue
    label: Catalogue
    label_singular: Publication
    folder: content/catalogue
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "/catalogue/{{slug}}/"
    summary: "{{number}} · {{title}}"
    sortable_fields: [number, title, date]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: subtitle, label: Subtitle, widget: string, required: false }
      - { name: author, label: Author(s), widget: string, required: false }
      - { name: number, label: Catalogue number, widget: number, value_type: int, required: false, hint: "1, 2, 3... shown as No. 1" }
      - { name: date, label: Publication date, widget: datetime, time_format: false, date_format: "D MMM YYYY", hint: "Sets the order: newest first." }
      - { name: year, label: Year shown, widget: string, required: false }
      - { name: excerpt, label: Short description, widget: string, required: false, hint: "One line under the cover on the home page and catalogue. Leave empty for none." }
      - { name: type, label: Type, widget: string, required: false, hint: "e.g. Artist's book, Photobook, Essay" }
      - { name: format, label: Format, widget: string, required: false, hint: "e.g. Folded sheet, A3 folding to A4" }
      - { name: pages, label: Pages, widget: string, required: false }
      - { name: edition, label: Edition, widget: string, required: false, hint: "e.g. 50 copies" }
      - { name: design, label: Design, widget: string, required: false }
      - { name: printer, label: Printed by, widget: string, required: false }
      - { name: isbn, label: ISBN, widget: string, required: false, hint: "978-... with hyphens, as Nielsen gives it" }
      - { name: price, label: Price, widget: string, required: false, hint: "e.g. £12, or Sold out" }
      - { name: sold_out, label: Sold out, widget: boolean, default: false, required: false, hint: "Shows Sold out instead of the price." }
      - { name: buy_url, label: Link to buy (optional), widget: string, required: false }
      - { name: buy_label, label: Buy button text, widget: string, required: false, hint: "Blank = Buy a copy" }
      - name: pdf_url
        label: PDF file
        widget: file
        required: false
        media_folder: /static/downloads
        public_folder: /downloads
        hint: "Three ways: upload a PDF (under 25 MB), OR paste a Dropbox share link (any size, shared as anyone with the link), OR paste another direct link. Lowercase file names with hyphens. Even page count = cover and back cover sit alone."
      - { name: download, label: Allow download, widget: boolean, default: true, required: false, hint: "Off = no Download PDF link (it can still be read online)." }
      - { name: page_layout, label: Page layout in the reader, widget: select, options: [{ label: "Automatic (scanned spreads shown one at a time)", value: auto }, { label: "Pair pages into spreads", value: spreads }, { label: "One page at a time", value: single }], default: auto, required: false }
      - { name: cover, label: Cover image (optional), widget: image, required: false, hint: "Leave empty and page 1 of the PDF is used." }
      - { name: description, label: One line for search and sharing, widget: string, required: false }
      - { name: body, label: About this publication, widget: markdown, modes: [rich_text, raw], required: false }
      - { name: draft, label: Hide from the site, widget: boolean, default: false, required: false }

  - name: pages
    label: Pages
    files:
      - name: homepage
        label: Homepage
        file: content/_index.md
        fields:
          - { name: title, label: Title, widget: hidden }
          - { name: heading, label: Big heading, widget: string }
          - { name: description, label: One line for search and sharing, widget: string, required: false }
          - { name: body, label: Statement, widget: markdown, modes: [rich_text, raw] }
      - name: about
        label: About
        file: content/about.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: One line for search and sharing, widget: string, required: false }
          - { name: body, label: Text, widget: markdown, modes: [rich_text, raw] }
      - name: catalogue
        label: Catalogue intro
        file: content/catalogue/_index.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: One line for search and sharing, widget: string, required: false }
          - { name: body, label: Intro (optional), widget: markdown, modes: [rich_text, raw], required: false }

  - name: settings
    label: Settings
    files:
      - name: design
        label: Design
        file: data/design.yml
        fields:
          - { name: background, label: Background colour, widget: color, hint: "Moss is #5f6b55" }
          - { name: text, label: Text colour, widget: color, hint: "Secondary text and lines follow it automatically. Keep it far from the background so it stays readable." }
          - { name: title_font, label: Font for the name and titles, widget: select, options: [Gilda Display, Gloock, Mazius Display, Basteleur, Fraunces, Young Serif, Bellefair, Cormorant SC, Marcellus, EB Garamond], default: Gilda Display }
          - { name: title_google, label: ...or a Google font for titles, widget: string, required: false, hint: "Optional: any font from fonts.google.com - type its name (e.g. Syne) or paste its page link. Overrides the list above. Leave empty to use the list." }
          - { name: title_capitals, label: Titles in capitals, widget: boolean, default: true }
          - { name: title_size, label: Title size, widget: select, options: [Smaller, Normal, Larger], default: Normal }
          - { name: menu_font, label: Font for the menu and details, widget: select, options: [Space Mono, Syne, Instrument Sans, Space Grotesk, EB Garamond], default: Space Mono }
          - { name: menu_google, label: ...or a Google font for the menu, widget: string, required: false, hint: "Optional: any font from fonts.google.com - type its name (e.g. Syne) or paste its page link. Overrides the list above. Leave empty to use the list." }
          - { name: reading_font, label: Font for reading (statement and notes), widget: select, options: [EB Garamond, Newsreader, Young Serif, Fraunces], default: EB Garamond }
          - { name: reading_google, label: ...or a Google font for reading, widget: string, required: false, hint: "Optional: any font from fonts.google.com - type its name (e.g. Syne) or paste its page link. Overrides the list above. Leave empty to use the list." }
          - { name: text_size, label: Menu and details size, widget: select, options: [Smaller, Normal, Larger], default: Normal }
      - name: site
        label: Contact
        file: data/site.yml
        fields:
          - { name: email, label: Public email address, widget: string, required: false, hint: "Shown in the footer on every page." }
